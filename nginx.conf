events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server {
        listen 80;
        listen [::]:80;
        server_name onepiece-battles.com www.onepiece-battles.com;
        # Normalise both the apex and www to the canonical apex host — the
        # single-domain certificate only covers onepiece-battles.com, so we
        # must not redirect www to https://www (that TLS handshake would fail).
        return 301 https://onepiece-battles.com$request_uri;
    }

    server {
        # ===== 开启 HTTP/2（nginx ≥ 1.25.1 的新写法）=====
        listen 443 ssl;
        http2 on;
        # ===============================

        # Single-domain certificate: serve the apex host only.
        server_name onepiece-battles.com;

        ssl_certificate /etc/nginx/ssl/onepiece-battles.com.pem;
        ssl_certificate_key /etc/nginx/ssl/onepiece-battles.com.key;

        # ===== 推荐优化：SSL 会话缓存（提升 TLS 握手性能）=====
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # =================================================

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Revalidate entrypoints after each deployment; cache static assets.
        location = /index.html {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }
        location = /flutter_bootstrap.js {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }
        location = /main.dart.js {
            add_header Cache-Control "no-cache, must-revalidate";
            try_files $uri =404;
        }

        location /api/onepiece/ {
            proxy_pass http://backend:8080/api/onepiece/;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        location /chat {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        error_page 404 /404.html;
        location = /40x.html {}
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {}

        client_max_body_size 100M;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf application/wasm;

        location ~* \.(?:css|js|wasm|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 1d;
            add_header Pragma public;
            add_header Cache-Control "public";
        }
    }
}
