events {
    worker_connections 1024;
}

http {
    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=chat_limit:10m rate=10r/s;
    limit_conn_zone $binary_remote_addr zone=addr_limit:10m;

    server {
        listen 80;
        listen [::]:80;
        server_name onepiece-battles.com www.onepiece-battles.com;
        return 301 https://$server_name$request_uri;
    }

    server {
        # ===== 核心修改：开启 HTTP/2 =====
        listen 443 ssl http2;
        # ===============================

        server_name onepiece-battles.com www.onepiece-battles.com;

        ssl_certificate /etc/nginx/ssl/www.onepiece-battles.com.pem;
        ssl_certificate_key /etc/nginx/ssl/www.onepiece-battles.com.key;

        # ===== 推荐优化：SSL 会话缓存（提升 TLS 握手性能）=====
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        # =================================================

        # ===== Security Headers =====
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' wss://onepiece-battles.com; frame-ancestors 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # ===========================

        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        location /api/onepiece/ {
            limit_req zone=api_limit burst=20 nodelay;
            limit_conn addr_limit 10;
            proxy_pass http://backend:8080/api/onepiece/;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        location /chat {
            limit_req zone=chat_limit burst=5 nodelay;
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page 404 /404.html;
        location = /40x.html {}
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {}

        client_max_body_size 20M;

        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf image/svg+xml;

        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public, immutable";
        }
    }
}
