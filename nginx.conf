events {
    worker_connections 1024; # The maximum number of simultaneous connections that can be opened by a worker process
}

http {
    server {
        listen 80;
        listen [::]:80;

        server_name onepiece-battles.com www.onepiece-battles.com;

        # Redirect HTTP to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl;

        server_name onepiece-battles.com www.onepiece-battles.com;

        # SSL certificate
        ssl_certificate /etc/nginx/ssl/onepiece-battles.com.pem;
        ssl_certificate_key /etc/nginx/ssl/onepiece-battles.com.key;

        # Root directory where Flutter web build files are located
        root /usr/share/nginx/html;
        index index.html;

        location / {
            try_files $uri $uri/ /index.html =404;
        }

        # Backend service
        location /api/onepiece/ {
            proxy_pass http://backend:8080/api/onepiece/;
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # Error pages
        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

        # Increase file upload size (optional, adjust as needed)
        client_max_body_size 100M;

        # Enable gzip compression (optional, but recommended)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/x-font-ttf;

        # Enable caching of static assets (optional, but recommended for performance)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public";
        }
    }
}
