
events {
    worker_connections 1024; # The maximum number of simultaneous connections that can be opened by a worker process
}

http {
    server {
        listen 80;

        server_name local.onepiece-battles.com;  # Change to your domain

        # Root directory where Flutter web build files are located
        root /usr/share/nginx/html;
        index index.html;

        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            try_files $uri $uri/ /index.html =404;
        }

        # Error pages
        error_page 404 /404.html;
            location = /40x.html {
        }

        error_page 500 502 503 504 /50x.html;
            location = /50x.html {
        }

        # Increase file upload size (optional, adjust as needed)
        client_max_body_size 100M;

        # Enable gzip compression (optional, but recommended)
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Enable caching of static assets (optional, but recommended for performance)
        location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|svg|woff|woff2|ttf|otf|eot)$ {
            expires 30d;
            add_header Pragma public;
            add_header Cache-Control "public";
        }
    }
}

